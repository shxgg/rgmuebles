<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RG Muebles | Próximamente</title>
  <!-- Fuentes Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: rgba(22, 20, 19, 0.95);
      --wood-color: #d8b28a;
      --wood-dark: #2a1f18;
      --accent-wood: #c89d7c;
      --text-main: #f5f5f5;
      --text-muted: #b0b0b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #221e1a 0%, #0d0c0b 100%);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .container {
      position: relative;
      max-width: 560px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(200, 157, 124, 0.25);
    }

    /* CABECERA ESTILO BANNER DE MADERA */
    .header-banner {
      background: #e5be93 linear-gradient(180deg, #edd0ab 0%, #d8ae80 100%);
      border-radius: 12px;
      padding: 25px 20px 18px 20px;
      color: #1a1a1a;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 25px;
    }

    .brand-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .brand-logo {
      height: 65px;
      width: auto;
      object-fit: contain;
    }

    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    /* Tira oscura inferior con los rubros */
    .services-bar {
      background-color: #2b211a;
      color: #f3e9df;
      padding: 8px 15px;
      border-radius: 25px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      word-spacing: 2px;
    }

    /* CONTENIDO PRINCIPAL */
    .status-badge {
      display: inline-block;
      padding: 6px 18px;
      background: rgba(200, 157, 124, 0.15);
      border: 1px solid rgba(200, 157, 124, 0.4);
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #e2c0a5;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .description {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 25px;
      font-weight: 300;
      padding: 0 10px;
    }

    /* SECCIÓN QR AMPLIADO */
    .qr-section {
      margin: 25px 0;
      display: flex;
      justify-content: center;
    }

    .qr-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      border: 3px solid var(--accent-wood);
      display: inline-block;
    }

    .qr-box img {
      width: 180px; /* Tamaño más grande y visible */
      height: 180px;
      display: block;
      border-radius: 6px;
      object-fit: contain;
    }

    /* BOTONES DE CONTACTO */
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 25px;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .contact-btn:hover {
      background: rgba(200, 157, 124, 0.18);
      border-color: var(--accent-wood);
      transform: translateY(-2px);
    }

    .contact-btn i {
      font-size: 1.5rem;
      color: var(--accent-wood);
      width: 35px;
      text-align: center;
      margin-right: 12px;
    }

    .contact-text {
      text-align: left;
    }

    .contact-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .contact-value {
      font-size: 1.05rem;
      font-weight: 600;
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 18px;
      }
      .brand-name {
        font-size: 2.1rem;
      }
      .brand-logo {
        height: 50px;
      }
      .services-bar {
        font-size: 0.65rem;
        letter-spacing: 1px;
      }
      .qr-box img {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- CABECERA ESTILO MADERA -->
    <div class="header-banner">
      <div class="brand-top">
        <img src="logo.png" alt="RG Muebles Logo" class="brand-logo">
        <span class="brand-name">RG Muebles</span>
      </div>
      <div class="services-bar">
        COCINAS &bull; BAÑOS &bull; VESTIDORES &bull; REVESTIMIENTOS
      </div>
    </div>

    <!-- MENSAJE PRINCIPAL -->
    <div class="status-badge">¡Estamos diseñando!</div>
    <p class="description">
      Si querés amueblar tu espacio o convertir tus proyectos en realidad, comunicate con nosotros:
    </p>

    <!-- CÓDIGO QR AMPLIADO -->
    <div class="qr-section">
      <div class="qr-box">
        <img src="qr.png" alt="QR RG Muebles">
      </div>
    </div>

    <!-- BOTONES DE CONTACTO DIRECTO -->
    <div class="contact-links">
      <a href="https://wa.me/5491144965647" class="contact-btn" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
        <div class="contact-text">
          <div class="contact-label">WhatsApp Directo</div>
          <div class="contact-value">11 4496 5647</div>
        </div>
      </a>

      <a href="mailto:amoblamientos@rgmuebles.com.ar" class="contact-btn">
        <i class="fa-regular fa-envelope"></i>
        <div class="contact-text">
          <div class="contact-label">Enviar Correo</div>
          <div class="contact-value">amoblamientos@rgmuebles.com.ar</div>
        </div>
      </a>
    </div>

  </div>

  <footer>
    &copy; 2026 RG Muebles. Todos los derechos reservados.
  </footer>

</body>
</html>
